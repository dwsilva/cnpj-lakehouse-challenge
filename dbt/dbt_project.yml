name: cnpj_lakehouse
version: 1.0.0
config-version: 2

profile: cnpj_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  cnpj_length: 14
  policy_tag_cnpj_cpf: "local-dev"
  policy_tag_nome: "local-dev"
  policy_tag_endereco: "local-dev"

models:
  cnpj_lakehouse:
    +meta:
      project: cnpj_lakehouse
      cost_center: cnpj-analytics
      environment: "{{ target.name }}"
    +labels:
      cost_center: cnpj-analytics
      managed_by: dbt

    staging:
      +materialized: view
      +schema: staging
      +tags: [layer:staging]
      +meta:
        layer: staging
        dataset: staging

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: [layer:intermediate]
      +meta:
        layer: intermediate
        dataset: intermediate

    marts:
      +materialized: table
      +schema: marts
      +tags: [layer:marts]
      +meta:
        layer: marts
        dataset: marts

snapshots:
  cnpj_lakehouse:
    +target_schema: snapshots
    +tags: [layer:snapshots]
    +strategy: timestamp
    +updated_at: dbt_updated_at
